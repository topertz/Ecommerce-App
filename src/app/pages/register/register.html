<section class="register-page">

  <div class="register-card">

<h1>Admin Registration</h1>

<p>
  Create an account to access the admin panel.
</p>

@if (errorMessage) {
  <div class="error-message">
    {{ errorMessage }}
  </div>
}

<form (submit)="register(); $event.preventDefault()">

  <div class="form-group">

    <label for="username">
      Username
    </label>

    <input
      id="username"
      type="text"
      name="username"
      [(ngModel)]="username"
      required>

  </div>

  <div class="form-group">

    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      name="password"
      [(ngModel)]="password"
      required>

  </div>

  <div class="form-group">

    <label for="confirmPassword">
      Confirm Password
    </label>

    <input
      id="confirmPassword"
      type="password"
      name="confirmPassword"
      [(ngModel)]="confirmPassword"
      required>

  </div>

  <button
    type="submit"
    [disabled]="loading">

    @if (loading) {
      Registering...
    } @else {
      Register
    }

  </button>

</form>

<p class="login-link">
  Already have an account?
  <a routerLink="/login">
    Login
  </a>
</p>

<a
  routerLink="/"
  class="back-link">
  Back to Store
</a>

  </div>

</section>
